[package]
name = "glados-voice"
description = "GLaDOS voice changer for Linux: live voice, text to speech and a note editor"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
cpal = "0.18.2"
glados-dsp = { path = "../glados-dsp" }
gtk4 = { version = "0.11.5", features = ["v4_14"] }
pangocairo = "0.22.9"
ringbuf = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
